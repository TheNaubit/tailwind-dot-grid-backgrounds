<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=block" rel="stylesheet">
<style>/* CSS */</style>
</head>
<body class="m-0 bg-black">
<main class="relative h-[430px] w-[1200px] overflow-hidden border-[6px] border-black font-display">
	<!-- The two backgrounds, drawn by the plugin itself -->
	<div class="absolute inset-0 bg-canary bg-grid-black bg-grid-size-7 bg-grid-stroke-2"></div>
	<div class="seam absolute inset-0 bg-black"></div>
	<div class="dots absolute inset-0 bg-mint bg-dot-black bg-dot-size-5 bg-dot-radius-[1.6px]"></div>

	<!-- Title card -->
	<div class="absolute top-1/2 left-1/2 w-[640px] -translate-x-1/2 -translate-y-1/2 -rotate-2 rounded-[22px] border-[5px] border-black bg-white px-12 pt-9 pb-10 shadow-[12px_12px_0_#000]">
		<p class="m-0 text-[26px] font-medium tracking-[-0.01em] text-black/70">Tailwind CSS</p>
		<h1 class="m-0 mt-1 text-[92px] leading-[0.86] font-extrabold tracking-[-0.045em] text-black">Dot &amp; grid<br>backgrounds</h1>
	</div>

	<!-- Stickers naming the utilities that draw each half -->
	<p class="absolute top-9 left-9 m-0 rotate-[-4deg] rounded-full border-[4px] border-black bg-white px-5 py-2 text-[24px] font-extrabold tracking-[-0.02em] shadow-[5px_5px_0_#000]">bg-grid-black</p>
	<p class="absolute right-10 bottom-10 m-0 rotate-[3deg] rounded-full border-[4px] border-black bg-white px-5 py-2 text-[24px] font-extrabold tracking-[-0.02em] shadow-[5px_5px_0_#000]">bg-dot-black</p>
</main>
</body>
</html>
