name: CI

on:
  push:
    branches: [main, v1]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Maintenance LTS, Active LTS and Current
        node-version: [22, 24, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

  tailwind-compat:
    name: Tailwind CSS ${{ matrix.tailwind-version }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The oldest supported release of the peer dependency range
        tailwind-version: ["4.0.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Tailwind CSS ${{ matrix.tailwind-version }}
        env:
          TAILWIND_VERSION: ${{ matrix.tailwind-version }}
        # Exact versions, read-only job without secrets, no install scripts
        run: npm install --no-save --ignore-scripts "tailwindcss@$TAILWIND_VERSION" "@tailwindcss/node@$TAILWIND_VERSION" # zizmor: ignore[adhoc-packages]

      - name: Run smoke tests
        run: npx vitest run test/smoke.test.ts
