name: Release

on:
  push:
    # "main" releases the current major, "v1" the Tailwind CSS v3 maintenance line (npm dist-tag "release-v1").
    branches: [main, v1]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test & Release
    runs-on: ubuntu-26.04
    # Must match the environment configured in the npm trusted publisher settings.
    environment: npm
    permissions:
      # Push the release commit and tag, create the GitHub release
      contents: write
      # Comment on the issues and pull requests included in a release
      issues: write
      pull-requests: write
      # npm trusted publishing (OIDC) and provenance: no npm token is stored in the repository
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release authenticates its own pushes with GITHUB_TOKEN
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          # No dependency cache when building a release artifact (avoids cache poisoning)
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
