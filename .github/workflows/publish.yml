name: Publish to NPM

on:
  release:
    types: [published]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Must match the environment configured in the npm trusted publisher settings.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no npm token is stored in the repository.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          # No dependency cache when building a release artifact (avoids cache poisoning)
          package-manager-cache: false

      - name: Check npm version
        # Trusted publishing requires npm 11.5.1 or later.
        run: |
          npm_version=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$npm_version" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm $npm_version does not support trusted publishing (11.5.1 or later required)"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run lint

      - name: Run tests
        run: npm run test:run

      # Releases of an older major (e.g. the v1 maintenance line) must not move the "latest" dist-tag.
      - name: Resolve npm dist-tag
        id: dist-tag
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Fail on any registry error (it could wrongly move "latest"), except when the package was never published.
          if ! latest=$(npm view "$name" version 2>npm-view.err); then
            grep -q E404 npm-view.err || { cat npm-view.err; exit 1; }
            latest="0.0.0"
          fi
          if [ "${version%%.*}" -lt "${latest%%.*}" ]; then
            echo "tag=v${version%%.*}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      # Authenticated with npm trusted publishing (OIDC), which also generates the provenance attestation.
      - name: Publish package on NPM
        run: npm publish --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
